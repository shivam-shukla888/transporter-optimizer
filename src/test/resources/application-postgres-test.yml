spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:freightfox}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:freightfox}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:freightfox}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

